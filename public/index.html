<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>投票ページ</title></head>
  <body>
    <h1>投票ページ /vote/1</h1>
    <div id="title"></div><div id="list"></div><div id="msg"></div>
    <script>
      const titleEl = document.getElementById('title');
      const list = document.getElementById('list');
      const msg = document.getElementById('msg');
      const categoryId = 1;
      async function load(){
        const res = await fetch(`/api/status?categoryId=${categoryId}`);
        const data = await res.json();
        if(!res.ok){msg.textContent=data.error||'失敗'; return;}
        titleEl.innerHTML = `<h2>${data.category.title}</h2>`;
        list.innerHTML='';
        data.category.options.forEach(o=>{
          const d=document.createElement('div');
          d.innerHTML=`<b>${o.name}</b> (${o.count}) <button data-name="${o.name}" ${data.voted?'disabled':''}>投票</button>`;
          list.appendChild(d);
        });
        list.querySelectorAll('button').forEach(btn=>btn.onclick=()=>vote(btn.dataset.name));
        if(data.voted) msg.textContent='このブラウザ/IPはすでに投票済みです。';
      }
      async function vote(optionName){
        const res = await fetch('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({categoryId, optionName})});
        const data = await res.json();
        msg.textContent = res.ok ? `「${optionName}」へ投票しました。` : (data.error || '失敗');
        await load();
      }
      load();
    </script>
  </body>
</html>
