<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>投票管理</title></head><body>
<h1>投票管理</h1><button id="addCategory">カテゴリ追加</button><button id="save">保存</button><div id="rows"></div><div id="msg"></div>
<script>
let ballots=[]; const rows=document.getElementById('rows'); const msg=document.getElementById('msg');
function render(){rows.innerHTML=''; ballots.forEach((b,i)=>{const d=document.createElement('div'); d.style.border='1px solid #ddd'; d.style.margin='8px'; d.style.padding='8px'; d.innerHTML=`<div>id:<input data-k='id' data-i='${i}' value='${b.id}'/> title:<input data-k='title' data-i='${i}' value='${b.title}'/></div><div id='opts-${i}'></div><button data-addopt='${i}'>選択肢追加</button>`; rows.appendChild(d); const opts=d.querySelector(`#opts-${i}`); b.options.forEach((o,j)=>{const p=document.createElement('div'); p.innerHTML=`name:<input data-k='name' data-i='${i}' data-j='${j}' value='${o.name}'/> count:<input data-k='count' data-i='${i}' data-j='${j}' value='${o.count}'/>`; opts.appendChild(p);});}); rows.querySelectorAll('input').forEach(inp=>inp.onchange=e=>{const i=Number(e.target.dataset.i); const j=e.target.dataset.j; const k=e.target.dataset.k; if(j===undefined){ballots[i][k]=k==='title'?e.target.value:Number(e.target.value);}else{ballots[i].options[Number(j)][k]=k==='name'?e.target.value:Number(e.target.value);}}); rows.querySelectorAll('button[data-addopt]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.addopt); ballots[i].options.push({name:'',count:0}); render();});}
async function load(){const r=await fetch('/api/admin'); const d=await r.json(); if(!r.ok){msg.textContent=d.error;return;} ballots=d.ballots; render();}
document.getElementById('addCategory').onclick=()=>{ballots.push({id:Date.now(),title:'',options:[{name:'',count:0}]}); render();};
document.getElementById('save').onclick=async()=>{const r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ballots})}); const d=await r.json(); msg.textContent=r.ok?'保存しました':d.error; if(r.ok){ballots=d.ballots;render();}};
load();
</script></body></html>
